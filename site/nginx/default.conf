server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Healthcheck контейнера. Отдельный путь, чтобы проверка не зависела от
    # наличия интернета до GitHub.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Единственный канонический адрес файла: /downloads/<имя файла>.
    #
    # 302, а не 301: редирект ведёт на внешний хост, и мы не хотим, чтобы
    # браузеры закешировали его навсегда — хранилище может переехать.
    #
    # Имя файла ограничено [A-Za-z0-9._-]: это и есть все символы в именах
    # ассетов. Ограничение отсекает вложенные пути, обход каталога и любые
    # нестандартные имена, для которых в релизе ничего нет.
    location ~ ^/downloads/(?<asset>[A-Za-z0-9._-]+)$ {
        limit_except GET HEAD { deny all; }
        return 302 https://github.com/QuantumArt/storage/releases/download/v1/$asset;
    }

    # Каталог без имени файла, несуществующее имя, вложенный путь.
    location /downloads/ {
        default_type text/plain;
        return 404 "unknown file\n";
    }

    # Единственная отдаваемая страница: индекс состава хранилища.
    location = / {
        try_files /index.html =404;
    }

    location / {
        default_type text/plain;
        return 404 "not found\n";
    }
}
