server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Healthcheck контейнера. Отдельный путь, чтобы проверка не зависела от
    # наличия интернета до GitHub.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Единственный канонический адрес файла: /downloads/<имя файла>.
    #
    # 302, а не 301: редирект ведёт на внешний хост, и мы не хотим, чтобы
    # браузеры закешировали его навсегда — хранилище может переехать.
    #
    # Имя файла ограничено [A-Za-z0-9._-]: это и есть все символы в именах
    # ассетов. Ограничение отсекает вложенные пути, обход каталога и любые
    # нестандартные имена.
    #
    # Дальше — проверка по списку из манифеста (assets.conf, генерируется
    # tools/build_index.py). Без неё любое имя давало бы 302 на несуществующий
    # ассет, и посетитель получал бы страницу 404 от GitHub вместо ответа
    # своего хранилища. `return` внутри `if` — безопасное из двух применений
    # директивы if в nginx.
    location ~ ^/downloads/(?<asset>[A-Za-z0-9._-]+)$ {
        limit_except GET HEAD { deny all; }
        if ($release_url = "") { return 404 "unknown file\n"; }
        return 302 $release_url;
    }

    # Каталог без имени файла, несуществующее имя, вложенный путь.
    location /downloads/ {
        default_type text/plain;
        return 404 "unknown file\n";
    }

    # Единственная отдаваемая страница: индекс состава хранилища.
    location = / {
        try_files /index.html =404;
    }

    location / {
        default_type text/plain;
        return 404 "not found\n";
    }
}
