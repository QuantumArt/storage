services:
  web:
    build:
      # Контекст — корень репозитория: Dockerfile копирует manifest/ и tools/,
      # а в образе они нужны для генерации индекса.
      context: ..
      dockerfile: Dockerfile
    image: anisimovs/storage:latest
    container_name: storage-web
    restart: unless-stopped
    # Контейнер слушает только loopback хоста. Наружу торчит исключительно
    # хостовый nginx (:443) — это его TLS и его rate limiting.
    ports:
      - "127.0.0.1:3022:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
