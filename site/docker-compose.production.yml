# Имя проекта compose — обязательно задано явно.
#
# Без него compose берёт имя из basename каталога с compose-файлом. Здесь
# каталог `site/`, и у проектов downloads и nuget каталог ТОЖЕ `site/` — все
# три назывались бы `site`. Само по себе это даёт безобидное
# `WARN Found orphan containers (downloads-web) for this project`, но опасно
# в действии: `docker compose down --remove-orphans` в ~/storage/site снёс бы
# ещё и боевые контейнеры соседей. Найдено и проверено на проекте nuget.
name: storage

services:
  web:
    build:
      # Контекст — корень репозитория: Dockerfile копирует manifest/ и tools/,
      # а в образе они нужны для генерации индекса.
      context: ..
      dockerfile: Dockerfile
    image: quantumart/storage:latest   # имя образа в Docker обязательно строчное
    container_name: storage-web
    restart: unless-stopped
    # Контейнер слушает только loopback хоста. Наружу торчит исключительно
    # хостовый nginx (:443) — это его TLS и его rate limiting.
    #
    # Порт 3023, а не 3022: 3022 уже занят контейнером `nuget-baget`
    # (nuget.qsupport.ru). Заняты на момент 2026-10-05: 3001, 3010, 3020,
    # 3021, 3022, 5000, 7700, 8090, 9117. Перед первым запуском проверь
    # `docker ps`. Номер порта должен совпадать в трёх местах: здесь, в
    # deploy.sh (переменная PORT) и в nginx/storage.quantumart.ru.
    ports:
      - "127.0.0.1:3023:80"
    # Логи nginx пишутся в файлы НА ХОСТЕ. Volume перекрывает каталог
    # /var/log/nginx из образа (там симлинки на stdout), поэтому nginx пишет в
    # настоящие файлы. Без этого логи жили бы только в `docker logs` и пропали
    # бы при каждом `up -d --force-recreate`, а deploy.sh пересоздаёт контейнер
    # на каждом запуске.
    #
    # Каталог по умолчанию — /var/log/storage, по аналогии с соседним проектом
    # (/var/log/downloads). НЕ в /tmp: /tmp чистится при перезагрузке и не
    # предназначен для постоянных данных. Переопределяется переменной окружения
    # ST_LOGS_DIR.
    #
    # ВНИМАНИЕ: путь должен совпадать в трёх местах — здесь, в deploy.sh
    # (LOGS_DIR) и в site/logrotate-storage. Docker создаст отсутствующий
    # каталог сам, но от root: ему нужен root и на записи logrotate.
    volumes:
      - ${ST_LOGS_DIR:-/var/log/storage}:/var/log/nginx
    healthcheck:
      # 127.0.0.1, а не localhost: localhost резолвится в ::1, а nginx внутри
      # контейнера слушает только IPv4. Healthcheck на localhost стабильно
      # падал, и контейнер уходил в unhealthy при живом и работающем сайте —
      # ровно тот случай, который пришлось чинить на проекте downloads.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    # Ротация stdout-журнала контейнера. Основные логи ушли в файлы на хосте
    # (volume выше), но stdout не может быть пустым: туда уходит вывод при
    # падении контейнера и в цикле рестартов. Драйвер json-file без
    # ограничений растёт бесконечно и способен съесть диск, поэтому потолок
    # 30 МБ. Ротацию файлов на хосте ведёт logrotate, конфиг — в
    # site/logrotate-storage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
